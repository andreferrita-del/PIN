
name: PIN Build CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang make

      - name: Configure
        run: |
          chmod +x configure
          CXX=clang++ ./configure

      - name: Build
        run: |
          make -j$(nproc)

      - name: Verify executable
        run: |
          test -x build/host/pin
          ./build/host/pin --help || true

      - name: Clean
        run: make clean
